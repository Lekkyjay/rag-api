name: RAG CI Pipeline

on:
  push:
    paths:
      - 'k8s.txt'
      - 'main.py'
      - 'embed.py'

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          # Install a specific version of uv.
          version: "0.9.26"

      - name: Set up Python
        run: uv python install
        # This will respect the Python version pinned in the project.

      - name: Install dependencies
        run: uv sync --locked --all-extras --dev
      
      # - name: Enable caching
      #   uses: astral-sh/setup-uv@v7
      #   with:
      #     enable-cache: true

      - name: Rebuild embeddings
        run: python embed.py

      - name: Start API in mock mode
        run: |
          USE_MOCK_LLM=1 uv run uvicorn main:app --host 0.0.0.0 --port 5000 &
          sleep 5

      - name: Run semantic tests
        run: python semantic_test.py

      - name: Success
        run: echo "✅ All tests passed! RAG quality maintained."
